name: Run AI Agent
on:
  workflow_dispatch:
jobs:
  run-agent:
    runs-on: ubuntu-latest
steps:
- name: Checkout repo
        uses: actions/checkout@v4
 - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
  - name: Run Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node engine/agent-runner.js
